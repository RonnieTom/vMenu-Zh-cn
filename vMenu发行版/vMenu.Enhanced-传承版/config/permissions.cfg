###############################################################################
#  本文件会在每次启动 vMenu Enhanced 时重新生成。
#  你对它做的任何修改都会丢失。
#
#  使用方法：
#    1. 复制本文件，并将副本命名为 'permissions.cfg'。
#    2. 只编辑那份副本，不要改本文件。
#    3. 在 server.cfg 里、启动 vMenu 的那一行之上 exec 它：
#
#         exec @vMenu.Enhanced/config/permissions.cfg
#         ensure vMenu.Enhanced
#
#  权限是实时检查的。但是，permissions.cfg 不会自动重新执行。
#  你可以手动再 exec 一次，但若改动很大我不建议这样做，因为冲突的 ace
#  与 principal 会出问题。若只是把某人加进某个组，直接在服务器控制台
#  手动执行那一条命令即可，然后再执行 `vmenu_refresh_permissions`，
#  所有人的菜单权限会自动刷新。大幅度修改 permissions.cfg 时，
#  我仍建议重启服务器！
###############################################################################

# vMenu 需要下面两行，以便集成的角色同步能为玩家添加/移除权限组。
# 若你不用角色同步，这两行没有实际作用。
add_ace resource.vMenu.Enhanced command.add_principal allow
add_ace resource.vMenu.Enhanced command.remove_principal allow

# 用玩家的某个标识符将其加入权限组。用你最方便查询的那种即可。
# 注意：Steam 标识符在 FiveM Enhanced 中已不再可用，请使用 license、
# license2、discord 或 fivem。也可以用 IP 标识符，但我不推荐。
# !!! 请务必换成你自己的标识符，并去掉前面的 # !!!
# 若你在运行时用其他系统加人到 principal 组（例如 TxAdmin 管理管理员），
# 则不必在此手动添加。
# add_principal identifier.discord:223799456162775043 group.admin
# add_principal identifier.fivem:25104 group.admin

# 组之间可以互相继承（若正确配置）。下面这行让 group.admin 拥有
# group.mod 的全部权限，再叠加下方单独授予 group.admin 的权限。
add_principal group.admin group.mod

# 下方列出了 vMenu Enhanced 已知的全部权限，可直接使用。
# 每一行已建议授予对象：适合所有玩家的用 builtin.everyone，
# 应留给管理的用 group.admin。若应由别人拥有，请改 principal。
#
# 若某行下方有缩进的子行，表示会一并授予那些子权限；一旦下方有任何一项
# 需要给管理，父级也会建议写成 group.admin。因此 .All 可能写 group.admin，
# 而其下多数行仍是 builtin.everyone——那些行仍单独存在，玩家仍会保留。
#
# 以 .All 结尾的权限会授予其下嵌套的全部内容，通常只保留 .All 一行即可。
# 若要限制部分功能，删掉 .All，只保留下面具体行，或在不想要的行前加 #。
# 更多权限说明见：https://docs.vespura.com/vMenu/Enhanced/
#
# 插件带来的权限不会列在这里。每个插件在 config/plugins/ 下有
# 以其资源名命名的一对模板。下方的 vMenu.Enhanced.Plugins.All 仍可
# 一次授予全部插件权限；只有需要逐项分配时才用那些文件。

# 注意：下方部分权限有缩进，只是为了标示它们属于哪个父级。
# 在 permissions.cfg 里是否缩进都不影响执行，从 server.cfg exec 时无差别。

