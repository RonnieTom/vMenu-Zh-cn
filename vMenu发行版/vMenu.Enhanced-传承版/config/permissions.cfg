###############################################################################
#  杂项设置（Misc Settings）
#  含语言、呼叫管理、个人偏好等；通常给所有人。
###############################################################################

  # 【杂项设置 · 全部】
  add_ace builtin.everyone "vMenu.Enhanced.Menus.MiscSettings.All" allow

