###############################################################################
#  vMenu Enhanced 权限配置（本文件为实际使用的副本）
#
#  在 server.cfg 里、启动 vMenu 的那一行之上 exec：
#
#         exec @vMenu.Enhanced/config/permissions.cfg
#         ensure vMenu.Enhanced
#
#  权限是实时检查的，但本文件不会自动重新执行。
#  若只是把某人加进某个组：在控制台执行那一条 add_principal，
#  再执行 `vmenu_refresh_permissions`。大幅度修改后建议重启服务器。
#
#  说明：
#  - 权限由低到高：builtin.everyone → group.civ → group.admin → group.mod
#    （高级组通过 add_principal 继承低级组的全部 ACE）
#  - 以 .All 结尾的权限会授予其下嵌套的全部子权限；通常只保留 .All 即可
#  - 要限制功能：删掉 .All，只保留需要的行，或在不想要的行前加 #
#  - 缩进仅便于阅读，不影响执行
#  - 更多文档：https://docs.vespura.com/vMenu/Enhanced/
###############################################################################

###############################################################################
#  资源自身权限（角色同步用）
###############################################################################

# 允许 vMenu 资源在运行时为玩家添加/移除权限组（集成角色同步）。
# 若不用角色同步，这两行没有实际作用，可保留无妨。
add_ace resource.vMenu.Enhanced command.add_principal allow
add_ace resource.vMenu.Enhanced command.remove_principal allow

###############################################################################
#  把玩家加入权限组
###############################################################################

# 用玩家标识符加入组。Steam 在 FiveM Enhanced 中已不可用，请用
# license / license2 / discord / fivem（不推荐用 IP）。
# !!! 换成你自己的标识符，并去掉前面的 # !!!
# 若用 TxAdmin 等系统在运行时加人，则不必在此手动添加。
# add_principal identifier.discord:223799456162775043 group.admin
# add_principal identifier.fivem:25104 group.admin

# 组继承（高级继承低级）：
#   group.mod    ← 继承 admin（因此也继承 civ）→ 权限最高
#   group.admin  ← 继承 civ
#   group.civ    ← 仅本组 ACE + builtin.everyone（所有人自带）
#   builtin.everyone ← 所有进服玩家（无需 add_principal）
add_principal group.admin group.civ
add_principal group.mod group.admin

# —— 版主 group.mod（最高：含 admin + civ + everyone）——
add_principal identifier.fivem:12437038 group.mod #RONNIE
add_principal identifier.fivem:7935633 group.mod #E斯特
add_principal identifier.fivem:7473400 group.mod #WONG
add_principal identifier.fivem:8998138 group.mod #内阁
add_principal identifier.fivem:5986825 group.mod #andy
add_principal identifier.fivem:11700083 group.mod #杰拉德

# —— 管理员 group.admin（含 civ + everyone）——
add_principal identifier.fivem:8521475 group.admin
add_principal identifier.fivem:10745251 group.admin

# —— 平民组 group.civ（仅 civ 专属 ACE + everyone；需在下方给 group.civ 单独挂权限才有额外能力）——
add_principal identifier.fivem:17107372 group.civ #raymandel
add_principal identifier.fivem:16252138 group.civ #QINGLANG

###############################################################################
#  总开关
###############################################################################

# 【全部权限】一键拥有 vMenu 的一切功能（含菜单、插件、补充权限等）。
# 挂在 group.admin：admin 与继承它的 group.mod 都会拥有；civ / everyone 不会。
add_ace group.admin "vMenu.Enhanced.Everything" allow

###############################################################################
#  集成（白名单 / 进服队列）
###############################################################################

# 【集成 · 全部】下方集成相关子权限的总开关。
add_ace group.admin "vMenu.Enhanced.Integration.All" allow

  # 绕过服务器白名单，可直接进服（需在 configuration.cfg 开启 Allowlist）。
  add_ace group.admin "vMenu.Enhanced.Integration.Allowlist.Bypass" allow

  # 绕过进服排队（需在 configuration.cfg 开启 Queue，并由外部工具管理队列）。
  add_ace group.admin "vMenu.Enhanced.Integration.Queue.Bypass" allow

###############################################################################
#  全部菜单总开关
###############################################################################

# 【所有菜单】一次授予下面所有菜单类权限。
add_ace group.admin "vMenu.Enhanced.Menus.All" allow

###############################################################################
#  管理菜单（Admin）
#  全服管理工具：公告、清场、抓人、刷新权限等。默认仅管理。
###############################################################################

  # 【管理菜单 · 全部】
  add_ace group.admin "vMenu.Enhanced.Menus.Admin.All" allow
    # 发送全服公告
    add_ace group.admin "vMenu.Enhanced.Menus.Admin.Announce" allow
    # 清理玩家周围区域（载具/碎片等，半径见 configuration.cfg）
    add_ace group.admin "vMenu.Enhanced.Menus.Admin.ClearArea" allow
    # 删除服务器上全部载具
    add_ace group.admin "vMenu.Enhanced.Menus.Admin.DeleteAllVehicles" allow
    # 仅删除无人乘坐的空载具
    add_ace group.admin "vMenu.Enhanced.Menus.Admin.DeleteEmptyVehicles" allow
    # 删除指定/附近的一辆载具
    add_ace group.admin "vMenu.Enhanced.Menus.Admin.DeleteVehicle" allow
    # 冻结附近玩家
    add_ace group.admin "vMenu.Enhanced.Menus.Admin.FreezePlayer" allow
    # 抓住附近玩家（拉到身边等）
    add_ace group.admin "vMenu.Enhanced.Menus.Admin.GrabPlayer" allow
    # 在菜单中增删定时公告（会重写 announcements.json）
    add_ace group.admin "vMenu.Enhanced.Menus.Admin.ManageAnnouncements" allow
    # 打开「管理」菜单本身
    add_ace group.admin "vMenu.Enhanced.Menus.Admin.Menu" allow
    # 刷新全服玩家菜单权限
    add_ace group.admin "vMenu.Enhanced.Menus.Admin.RefreshPermissions" allow
    # 重置自己的路由桶（维度）到默认
    add_ace group.admin "vMenu.Enhanced.Menus.Admin.ResetRoutingBucket" allow
    # 查看玩家之间的私信内容（敏感，务必只给受信管理）
    add_ace group.admin "vMenu.Enhanced.Menus.Admin.SeePrivateMessages" allow

###############################################################################
#  自动驾驶（AutoPilot）
###############################################################################

  # 【自动驾驶 · 全部】
  add_ace builtin.everyone "vMenu.Enhanced.Menus.AutoPilot.All" allow
    # 打开自动驾驶菜单（选目的地/预设让载具自动开）
    add_ace builtin.everyone "vMenu.Enhanced.Menus.AutoPilot.Menu" allow

###############################################################################
#  恶搞（Bully）
#  需在 configuration.cfg 中把 Bully.Enabled 设为 true 才会生效。
###############################################################################

  # 打开恶搞菜单（对玩家做恶作剧类操作）
  add_ace group.admin "vMenu.Enhanced.Menus.Bully.Menu" allow

###############################################################################
#  角色创建器（Character Creator）
###############################################################################

  # 【角色创建器 · 全部】
  add_ace builtin.everyone "vMenu.Enhanced.Menus.CharacterCreator.All" allow
    # 创建新角色
    add_ace builtin.everyone "vMenu.Enhanced.Menus.CharacterCreator.Create" allow
    # 管理已保存角色（重命名/删除等）
    add_ace builtin.everyone "vMenu.Enhanced.Menus.CharacterCreator.Manage" allow
    # 打开角色创建器菜单
    add_ace builtin.everyone "vMenu.Enhanced.Menus.CharacterCreator.Menu" allow
    # 使用在线服装/造型相关功能
    add_ace builtin.everyone "vMenu.Enhanced.Menus.CharacterCreator.OnlineOutfits" allow
    # 使用服装预设
    add_ace builtin.everyone "vMenu.Enhanced.Menus.CharacterCreator.Presets" allow
    # 管理服装预设（增删改）
    add_ace builtin.everyone "vMenu.Enhanced.Menus.CharacterCreator.PresetsManage" allow
    # 保存当前角色
    add_ace builtin.everyone "vMenu.Enhanced.Menus.CharacterCreator.Save" allow
    # 设为默认角色（进服自动使用）
    add_ace builtin.everyone "vMenu.Enhanced.Menus.CharacterCreator.SetDefault" allow
    # 生成/切换到已保存角色
    add_ace builtin.everyone "vMenu.Enhanced.Menus.CharacterCreator.Spawn" allow

###############################################################################
#  过场动画（Cutscenes）
###############################################################################

  # 打开过场动画菜单（播放游戏过场）
  add_ace builtin.everyone "vMenu.Enhanced.Menus.Cutscenes.Menu" allow

