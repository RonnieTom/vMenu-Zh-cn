###############################################################################
#  本文件会在每次启动 vMenu Enhanced 时重新生成。
#  你对它做的任何修改都会丢失。
#
#  使用方法：
#    1. 复制本文件，并将副本命名为 'configuration.cfg'。
#    2. 只编辑那份副本，不要改本文件。
#    3. 在 server.cfg 里、启动 vMenu 的那一行之上 exec 它：
#
#         exec @vMenu.Enhanced/config/configuration.cfg
#         ensure vMenu.Enhanced
#
#  下方大多数选项使用 'setr'，会同步到客户端。少数使用普通 'set'，
#  值只留在服务端，玩家读不到。这些通常是密钥类内容（例如 webhook URL），
#  切勿把它们的 'set' 改成 'setr'。
#
#  删除某个选项，或把它注释掉，会恢复 vMenu 自带的默认值。
#  不过我更建议你手动写成默认值，而不是注释掉：万一以后更新改了默认值，
#  你不会在游戏里突然发现行为变了。
###############################################################################

### 语言 ###

# 玩家可选择的语言，为不含 .json 的文件名，逗号分隔，顺序即选择器顺序。
# 每个代码都需要有对应的 language/<code>.json。要新增语言：把
# language/example.json 复制为 language/<code>.json，翻译后再把代码写到这里。
# 不要写 'en'（英语内置且始终可用），也不要用 'example'（模板文件，
# 每次 vMenu 更新都会被重写）。
# 默认值: "zh,nl,de,es,fr" (string)
setr vMenu.Enhanced.Languages "zh,nl,de,es,fr"

### 关于 ###

# 「关于」菜单中显示的文档链接。若想放自己服务器的文档，可改这里。
# 默认值: "https://docs.vespura.com/vmenu/enhanced" (string)
setr vMenu.Enhanced.DocumentationUrl "https://docs.vespura.com/vmenu/enhanced"

# 「关于」菜单中显示的 Discord 邀请链接。
# 默认值: "https://discord.gg/fivem" (string)
setr vMenu.Enhanced.DiscordUrl "https://discord.gg/fivem"

### 更新 ###

# 配置 vMenu 的自动版本检查。可选：'off'、'prerelease' 或 'stable'。
# 默认值: "prerelease" (string)
setr vMenu.Enhanced.Updates.CheckMode "prerelease"

### 按键绑定 ###

# 打开/关闭菜单的默认按键。键名见：
# https://docs.fivem.net/docs/game-references/input-mapper-parameter-ids/keyboard/
# 这只是默认键：玩家可在「设置 → 按键绑定」中自行改绑。
# 默认值: "M" (string)
setr vMenu.Enhanced.KeyBindings.MenuToggleKey "M"

# 开启/关闭穿墙（noclip）的默认按键。键名见：
# https://docs.fivem.net/docs/game-references/input-mapper-parameter-ids/keyboard/
# 这只是默认键：玩家可在「设置 → 按键绑定」中自行改绑。
# 默认值: "F2" (string)
setr vMenu.Enhanced.KeyBindings.NoClipToggleKey "F2"

# 执行「传送动作」（见游戏内传送菜单）的默认按键。键名见：
# https://docs.fivem.net/docs/game-references/input-mapper-parameter-ids/keyboard/
# 这只是默认键：玩家可在「设置 → 按键绑定」中自行改绑。
# 默认值: "F10" (string)
setr vMenu.Enhanced.KeyBindings.TeleportKey "F10"

### 菜单外观 ###

# 默认主题：'default'、'gold'、'green'、'red'、'gta'、'dark' 或 'cartoon'。
# 也可填插件新增的主题名。
# 默认值: "default" (string)
setr vMenu.Enhanced.MenuAppearance.Skin "default"

# 标题在横幅上的位置：'left'、'center' 或 'right'。
# 默认值: "left" (string)
setr vMenu.Enhanced.MenuAppearance.TitleAlignment "left"

# 是否启用菜单头部的地球仪与反光效果（类似 GTA 在线互动菜单）。
# 默认值: "true" (bool)
setr vMenu.Enhanced.MenuAppearance.HeaderGlare true

### 游戏玩法 ###

# 0 = vMenu 不干预 PVP，1 = 启用 PVP，2 = 禁用 PVP。
# 默认值: "1" (int)
setr vMenu.Enhanced.Gameplay.PvpMode 1

# 进出穿墙时，在该位置对附近所有人显示一缕烟雾。
# 默认值: "true" (bool)
setr vMenu.Enhanced.Gameplay.NoClipSmoke true

### 管理 ###

# 「清理区域」按钮的作用半径（米）。
# 默认值: "100" (int)
setr vMenu.Enhanced.Admin.ClearAreaRadius 100

# 「冻结」「抓住」按钮查找附近玩家的距离（米）。
# 默认值: "3" (int)
setr vMenu.Enhanced.Admin.ClosestPlayerRange 3

# 是否启用 config/announcements.json 中的定时公告。
# 默认值: "true" (bool)
setr vMenu.Enhanced.Admin.ScheduledAnnouncements true

# 公告在屏幕上停留的秒数。
# 默认值: "20" (int)
setr vMenu.Enhanced.Admin.AnnouncementSeconds 20

### 呼叫管理 ###

# 是否允许玩家通过杂项设置里的「呼叫管理」按钮通知管理。
# 默认值: "true" (bool)
setr vMenu.Enhanced.StaffAlerts.Enabled true

# 同一玩家两次发送呼叫之间的冷却秒数，用于防刷。
# 默认值: "60" (int)
setr vMenu.Enhanced.StaffAlerts.CooldownSeconds 60

# 一条呼叫在被丢弃前保持有效的秒数。
# 默认值: "300" (int)
setr vMenu.Enhanced.StaffAlerts.ExpireSeconds 300

# 呼叫在屏幕上显示的秒数。所有有效呼叫仍可在管理呼叫菜单中查看。
# 默认值: "30" (int)
setr vMenu.Enhanced.StaffAlerts.DisplaySeconds 30

### 在线玩家 ###

# 在下方时间窗口内，一名玩家可通过在线玩家菜单对他人执行的操作次数上限。
# 默认值: "8" (int)
setr vMenu.Enhanced.OnlinePlayers.ActionLimit 8

# 上述额度所统计的时间窗口长度（秒）。默认即每 10 秒 8 次操作。
# 默认值: "10" (int)
setr vMenu.Enhanced.OnlinePlayers.ActionLimitSeconds 10

# 传送到玩家、传送进其载具、召唤玩家时，是否也把人移到对方的路由桶
#（routing bucket，通常用于室内等独立维度）。
# 默认值: "true" (bool)
setr vMenu.Enhanced.OnlinePlayers.MatchRoutingBucket true

### 恶搞 ###

# 启用恶搞菜单（管理可对玩家做的恶作剧），以及个人载具的电击车门选项。
# 默认值: "false" (bool)
setr vMenu.Enhanced.Bully.Enabled false

# 关闭「爆炸」和「原子化器」恶搞动作（适合反作弊会标记爆炸的服务器）。
# 默认值: "false" (bool)
setr vMenu.Enhanced.Bully.DisableExplosions false

# 关闭「烟花」「箔条」「野兽惊吓」恶搞动作，以及「变车」的烟雾
#（适合反作弊会标记粒子特效的服务器）。
# 默认值: "false" (bool)
setr vMenu.Enhanced.Bully.DisableParticleEffects false

### 进出服 ###

# 是否将玩家连接记录到服务器控制台。
# 默认值: "true" (bool)
setr vMenu.Enhanced.JoinLeave.LogToConsole true

### Webhook 日志 ###

# 总开关：无论下方如何配置，都启用或禁用所有 webhook。
# 默认值: "false" (bool)
setr vMenu.Enhanced.Logging.Enabled false

# 服务器事件的 Discord webhook URL。请用 'set' 而非 'setr'，以保护 URL。
# 默认值: "" (string)
set vMenu.Enhanced.Logging.Webhook.Events ""

# 玩家对自己操作的 Discord webhook URL。人多时很吵，建议单独频道。
# 请用 'set' 而非 'setr'，以保护 URL。
# 默认值: "" (string)
set vMenu.Enhanced.Logging.Webhook.Actions ""

# 玩家之间操作（含因缺权限被拒绝）的 Discord webhook URL。
# 请用 'set' 而非 'setr'，以保护 URL。
# 默认值: "" (string)
set vMenu.Enhanced.Logging.Webhook.Staff ""

# 疑似作弊时的 Discord webhook URL。若留空，会改发到管理 webhook。
# 请用 'set' 而非 'setr'，以保护 URL。
# 默认值: "" (string)
set vMenu.Enhanced.Logging.Webhook.Security ""

# 玩家私信（含正文）的 Discord webhook URL。请放到仅受信管理可见的频道。
# 若留空，私信不会发到 Discord。请用 'set' 而非 'setr'，以保护 URL。
# 默认值: "" (string)
set vMenu.Enhanced.Logging.Webhook.Messages ""

# 以纯 JSON（非 Discord 消息）接收相同日志行的 URL，供自建工具使用。
# 若为 HTTPS，证书必须有效且受信任。请用 'set' 而非 'setr'，以保护 URL。
# 默认值: "" (string)
set vMenu.Enhanced.Logging.Webhook.Generic ""

# vMenu 多久发送一次已收集的日志（秒）。会批量发送而非逐条，以免 Discord 限流。
# 超出 1–60 的值会被钳制到该范围。
# 默认值: "4" (int)
setr vMenu.Enhanced.Logging.FlushSeconds 4

# 每个 webhook 在等待发送时最多缓存多少行。超出则丢弃最旧的，
# 下一条消息会说明丢了多少。防止无响应的 webhook 吃光服务器内存。
# 默认值: "500" (int)
setr vMenu.Enhanced.Logging.QueueLimit 500

# （限流）每个玩家在一个窗口内最多可记录多少次菜单操作。这些由玩家客户端上报，
# 可防止被改客户端刷爆频道。设为 0 关闭限制（不推荐）。
# 默认值: "30" (int)
setr vMenu.Enhanced.Logging.MenuActionLimit 30

# 上述菜单操作窗口的时长（秒）。
# 默认值: "10" (int)
setr vMenu.Enhanced.Logging.MenuActionLimitSeconds 10

# 每个玩家在一个窗口内最多可记录多少条安全相关日志。被改客户端可能每秒尝试上千次，
# 此限制可防止刷爆频道。下一条会说明漏掉了多少。设为 0 关闭限制（不推荐）。
# 默认值: "10" (int)
setr vMenu.Enhanced.Logging.SecurityLimit 10

# 上述安全日志窗口的时长（秒）。
# 默认值: "60" (int)
setr vMenu.Enhanced.Logging.SecurityLimitSeconds 60

### 玩家属性 ###

# 射击能力上限（百分比）。玩家仍可选更高数字，但 vMenu 只会应用到此处配置的上限。
# 默认值: "100" (int)
setr vMenu.Enhanced.PlayerOptions.MaxShooting 100

# 力量上限（百分比）。玩家仍可选更高数字，但 vMenu 只会应用到此处配置的上限。
# 默认值: "100" (int)
setr vMenu.Enhanced.PlayerOptions.MaxStrength 100

# 耐力上限（百分比）。玩家仍可选更高数字，但 vMenu 只会应用到此处配置的上限。
# 默认值: "100" (int)
setr vMenu.Enhanced.PlayerOptions.MaxStamina 100

# 潜行能力上限（百分比）。玩家仍可选更高数字，但 vMenu 只会应用到此处配置的上限。
# 默认值: "100" (int)
setr vMenu.Enhanced.PlayerOptions.MaxStealth 100

# 飞行能力上限（百分比）。玩家仍可选更高数字，但 vMenu 只会应用到此处配置的上限。
# 默认值: "100" (int)
setr vMenu.Enhanced.PlayerOptions.MaxFlying 100

# 驾驶能力上限（百分比）。玩家仍可选更高数字，但 vMenu 只会应用到此处配置的上限。
# 默认值: "100" (int)
setr vMenu.Enhanced.PlayerOptions.MaxDriving 100

# 肺活量上限（百分比）。玩家仍可选更高数字，但 vMenu 只会应用到此处配置的上限。
# 默认值: "100" (int)
setr vMenu.Enhanced.PlayerOptions.MaxLungCapacity 100

### 载具选项 ###

# /dv 命令（以及菜单中的删除载具）向前搜索载具的距离（米）。
# 默认值: "5.0" (float)
setr vMenu.Enhanced.VehicleOptions.DeleteVehicleDistance 5.0

# 是否启用 vMenu 的 /dv 命令。权限与载具选项菜单中的删除载具相同。
# 默认值: "true" (bool)
setr vMenu.Enhanced.VehicleOptions.DeleteVehicleCommand true

# 是否启用 /fixveh 快速修车命令。权限与载具选项菜单中的修复载具相同。
# 默认值: "true" (bool)
setr vMenu.Enhanced.VehicleOptions.RepairVehicleCommand true

# 是否启用 /washveh 快速洗车命令。权限与载具选项菜单中的清洗载具相同。
# 默认值: "true" (bool)
setr vMenu.Enhanced.VehicleOptions.WashVehicleCommand true

# 为 true 时，驾驶员下车后会立刻关闭该载具的无敌模式（若曾开启）。
# 默认值: "true" (bool)
setr vMenu.Enhanced.VehicleOptions.ClearGodModeOnExit true

### 个人载具 ###

# 个人载具远程操作在配置时间窗口内的次数上限。0 表示不限制。
# 默认值: "8" (int)
setr vMenu.Enhanced.PersonalVehicle.ActionLimit 8

# 上述限流的时间窗口（秒）。默认即 10 秒内 8 次。0 表示完全关闭限流。
# 默认值: "10" (int)
setr vMenu.Enhanced.PersonalVehicle.ActionLimitSeconds 10

# 请暂时保持 350.0，此 convar 仅用于调试。
# 默认值: "350.0" (float)
setr vMenu.Enhanced.PersonalVehicle.ControlRange 350.0

# 除非你清楚自己在做什么，否则请保持 1500。尝试范围内下一客户端操作载具的超时。
# 会依次尝试三名玩家后放弃，因此请保持在 5 秒以内。
# 默认值: "1500" (int)
setr vMenu.Enhanced.PersonalVehicle.ControlTimeout 1500

### 载具生成器 ###

# 生成该载具的玩家离服或崩溃时，服务器如何处理该载具。
# DeleteWhenNotRelevant = 0，DeleteOnOwnerDisconnect = 1，KeepEntity = 2。
# 默认值: "1" (int)
setr vMenu.Enhanced.VehicleSpawner.OrphanMode 1

# 在关闭「替换上一辆车」时生成新车后，是否仍保持上一辆已生成载具常驻，
# 而不是让游戏自行清理。开启后废弃载具会堆积，直到有人删除。
# 默认值: "false" (bool)
setr vMenu.Enhanced.VehicleSpawner.KeepSpawnedVehiclesPersistent false

# 下方三项生成额度所统计的时间窗口（秒）。设为 0 可完全关闭生成限制。
# 默认值: "60" (int)
setr vMenu.Enhanced.VehicleSpawner.SpawnLimitSeconds 60

# 等级 1 玩家在上述窗口内可生成的载具数。0 表示不限制。
# 默认值: "5" (int)
setr vMenu.Enhanced.VehicleSpawner.SpawnLimitTier1 5

# 等级 2 玩家在上述窗口内可生成的载具数。0 表示不限制。
# 默认值: "15" (int)
setr vMenu.Enhanced.VehicleSpawner.SpawnLimitTier2 15

# 等级 3 玩家在上述窗口内可生成的载具数。0 表示不限制。
# 默认值: "0" (int)
setr vMenu.Enhanced.VehicleSpawner.SpawnLimitTier3 0

### 天气选项 ###

# 启用或禁用 vMenu 的天气控制与同步。若由其他资源控制天气，请关闭。
# 默认值: "true" (bool)
setr vMenu.Enhanced.WeatherOptions.Enabled true

# 是否向所有玩家同步云层。
# 默认值: "true" (bool)
setr vMenu.Enhanced.WeatherOptions.SyncClouds true

# 在菜单中手动切换天气类型时，过渡所需秒数。
# 默认值: "45" (int)
setr vMenu.Enhanced.WeatherOptions.TransitionSeconds 45

# 服务器遵循的天气日程：'default'（普通 GTA 在线日程）、
# 'snowy'（下雪期间自动保持地面积雪的冬季日程），或
# 'custom'（来自 config/weather-cycle.json 的自定义日程，也是唯一可安排停电的）。
# 默认值: "default" (string)
setr vMenu.Enhanced.WeatherOptions.WeatherCycle "default"

### 时间选项 ###

# 启用 vMenu 的时间控制/同步。若由其他资源控制游戏时间，请设为 'false'。
# 默认值: "true" (bool)
setr vMenu.Enhanced.TimeOptions.Enabled true

# 游戏内时钟相对 GTA 正常速度的倍率。须在 0.01 到 1000 之间。
# 默认值: "1.0" (float)
setr vMenu.Enhanced.TimeOptions.SpeedMultiplier 1.0

# 时间选项菜单中可选的预设时间列表。
# 默认值: "0000,0300,0600,0900,1200,1500,1800,2100" (string)
setr vMenu.Enhanced.TimeOptions.Presets "0000,0300,0600,0900,1200,1500,1800,2100"

# 时间过渡时长。0 表示立即跳到目标时间。
# 默认值: "4" (int)
setr vMenu.Enhanced.TimeOptions.TransitionSeconds 4

### 世界 API ###

# 密码：允许你的自建工具通过 HTTP 读取天气、时间、日期与月相，
# 以便 Discord 机器人或网站展示天空状态。留空则关闭端点、不响应任何人。
# 设为任意长随机字符串后，调用方需在 X-vMenu-Token 请求头或 token 查询参数中提供。
# 使用 'set' 而非 'setr'：这是密钥。
# 默认值: "" (string)
set vMenu.Enhanced.WorldApi.Token ""

### 集成 ###

# 请阅读 https://docs.vespura.com/vmenu/enhanced/integrations。
# 使用 'set' 而非 'setr'！这对保护 API 密钥很重要！
# 默认值: "" (string)
set vMenu.Enhanced.Integration.ApiKey ""

# 本服务器连接的外部工具基址，例如 'https://example.com/api'。
# 可为 http 或 https，IP 或域名均可。若用 HTTPS，证书必须有效且受信任。
# 服务器会对该 URL 发起 HTTP(S) 请求，并打开由其派生的 websocket，
# 例如 'https://example.com/api' 变为 'wss://example.com/api/socket'
#（http 则用 'ws'）。留空则完全不发起出站调用。若要使用请先阅读文档。
# 使用 'set' 而非 'setr'。
# 默认值: "" (string)
set vMenu.Enhanced.Integration.Endpoint ""

# 为 true 时，允许通过 websocket 连接的外部工具对玩家执行操作，
# 例如：击杀、踢出、治疗等。使用 'set' 而非 'setr'。
# 默认值: "false" (bool)
set vMenu.Enhanced.Integration.AllowActions false

# 仅允许持有 'vMenu.Enhanced.Integration.Allowlist.Bypass' 权限的玩家，
# 或已连接集成（如 SnowstormBot）放行的玩家进入。使用 'set' 而非 'setr'。
# 默认值: "false" (bool)
set vMenu.Enhanced.Integration.Allowlist false

# 自定义不在白名单时看到的提示。
# 默认值: "你不在本服务器的白名单中。" (string)
set vMenu.Enhanced.Integration.AllowlistMessage "你不在本服务器的白名单中。"

# 为 true 时，连接中的玩家会进入由外部工具（如 SnowstormBot）管理的进服队列。
# 与白名单不同：没有外部工具管理时此功能无法工作！工具决定队列、优先级与延迟。
# 此 convar 只负责开关队列。持有 'vMenu.Enhanced.Integration.Queue.Bypass'
# 权限的玩家可选择跳过队列（进服界面有按钮）。使用 'set' 而非 'setr'。
# 默认值: "false" (bool)
set vMenu.Enhanced.Integration.Queue false

### 开发者功能 ###

# 启用「开发者功能」菜单。其中功能大多无害。可先试用，再决定是否在服务器上启用。
# 若不确定，请在公开正式服上关闭。
# 默认值: "true" (bool)
setr vMenu.Enhanced.DeveloperFeatures true

### 调试 ###

# 启用客户端额外控制台日志。
